<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapTrack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Calibri on Windows; Carlito (same letter widths as Calibri) everywhere else -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<!-- Leaflet draws the district map. If it fails to load, the app still works without the map. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: one narrow reading column on white; dark navy bands for the district name and the aquifer section */
:root {
  color-scheme: light;
  --ground: #FFFFFF;
  --surface: #F3F6FA;
  --ink: #0B1F3A;
  --muted: #475569;
  --rule: #DCE3EC;
  --line: #B4C0D0;
  --aquifer: #0B3D91;
  --band: #0B2545;
  --band-ink: #FFFFFF;
  --band-muted: #B8C7DC;
  --sand: #C9B98F;
  --magothy: #2A6A9E;
  --lloyd: #16406B;
  --clay: #6B5B45;
  --topsoil: #4E6B5C;
  --good: #1E7A46;
  --watch: #A15C00;
  --over: #B42318;
  --focus: #F2B705;
  --display: Calibri, Carlito, "Segoe UI", sans-serif;
  --body: Calibri, Carlito, "Segoe UI", sans-serif;
  --small: Arial, Helvetica, "Liberation Sans", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
/* Arial for small text: labels, captions, status lines, chips, footnotes */
.brand span, .find label, .msg, .band small, .basis, .log .say, .log .val em, .legend, .yc-ticks, .yc-top label, .glass-key, .terms-q,
button.term, button.chip, button.yb, .def, .foot, table, .map-legend, .ranking .say, .pick small, .other, .layers dd, .strata + .row,
.addr-list small, .leaflet-tooltip, .log .tip, .back { font-family: var(--small); }
a { color: var(--aquifer); }
a:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-wrap: balance; letter-spacing: -0.005em; margin: 0; }
.top { border-bottom: 1px solid var(--rule); }
.num { font-variant-numeric: tabular-nums; }

.top { padding-block: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand b { font-family: var(--display); font-size: 24px; }
.brand span { color: var(--muted); font-size: 14px; }
.find label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="text"], select { flex: 1 1 220px; min-width: 0; height: 48px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
button, .btn { height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--aquifer); color: var(--ground); font: inherit; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
button.quiet { background: transparent; color: var(--aquifer); border: 1.5px solid var(--line); }
.msg { font-size: 14px; color: var(--muted); min-height: 1.5em; margin: 6px 0 0; }
.msg.err { color: var(--over); }

.band { background: var(--band); color: var(--band-ink); }
.band .wrap { padding-block: 22px 0; }
.band small { color: var(--band-muted); font-size: 14px; display: block; }
.band h1 { font-size: clamp(30px, 8vw, 44px); line-height: 1.02; margin: 4px 0 6px; }
.strata { display: block; width: 100%; height: auto; margin-top: 16px; }
.band.ground { margin-top: 32px; }
.band.ground .wrap { padding-block: 26px 0; }
.band.ground h2 { font-size: 22px; margin-bottom: 8px; }
.band.ground p { margin: 0 0 14px; max-width: 65ch; }
.layers { display: grid; gap: 10px; margin: 0; }
.layers > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.layers dt { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.layers dt i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; flex: none; box-shadow: 0 0 0 1px var(--band-muted); }
.layers dd { margin: 0; color: var(--band-muted); font-size: 15px; }
@media (max-width: 420px) { .layers > div { grid-template-columns: 1fr; gap: 2px; } }

.verdict { font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.22; margin: 22px 0 8px; text-wrap: pretty; }
.basis { font-size: 14px; color: var(--muted); margin: 0 0 6px; }

.log { list-style: none; margin: 8px 0 0; padding: 0; }
.log li + li { border-top: 1px solid var(--rule); }
.log button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 34px 72px; align-items: center; gap: 14px; width: 100%; padding: 16px 0; cursor: pointer; }
.log button:hover .name { text-decoration: underline; text-underline-offset: 3px; }
.log button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.log .name { font-weight: 700; display: block; }
.log .say { font-size: 14px; display: block; }
.log .val { text-align: right; }
.log .val strong { font-size: 20px; display: block; line-height: 1.1; }
.log .val em { font-style: normal; font-size: 12px; color: var(--muted); }
.good { color: var(--good); } .watch { color: var(--watch); } .over { color: var(--over); } .quietc { color: var(--muted); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 0; }
.actions > * { flex: 1 1 200px; }

.foot { margin-top: 28px; padding-block: 18px 32px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }

.back { all: unset; cursor: pointer; color: var(--aquifer); font-size: 15px; padding: 12px 0; display: inline-block; text-decoration: underline; }
.detail h1 { font-size: clamp(30px, 8vw, 40px); line-height: 1.05; }
.lede { font-family: var(--display); font-weight: 500; font-size: 20px; line-height: 1.25; margin: 8px 0 0; text-wrap: pretty; }
.chart { margin: 18px 0 4px; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 320px; height: auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px dashed var(--over); vertical-align: middle; margin-right: 6px; }
.legend i.fed { border-top: 2px dotted var(--watch); }
.legend i.series { border-top: 3px solid var(--aquifer); }
.legend i.series2 { border-top: 3px solid var(--watch); }
section { margin-top: 26px; }
section h2 { font-size: 20px; margin-bottom: 8px; }
section p { margin: 0 0 10px; max-width: 65ch; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.steps li:last-child { border-bottom: 1px solid var(--rule); }
.steps b { font-variant-numeric: tabular-nums; }
.years { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }

fieldset { border: 0; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; margin-bottom: 8px; }
.pick { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
.pick:has(input:checked) { border-color: var(--aquifer); }
.pick input { width: 20px; height: 20px; accent-color: var(--aquifer); }
.pick span:first-of-type { flex: 1; }
.pick small { font-size: 13px; color: var(--muted); }
.answer { margin-top: 20px; padding: 20px; border-radius: 14px; background: var(--band); color: var(--band-ink); }
.answer small { color: var(--band-muted); display: block; font-size: 14px; }
.answer h2 { font-size: 26px; line-height: 1.1; margin: 6px 0 8px; }
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; padding: 10px 8px 10px 0; border-bottom: 2px solid var(--ink); }
td { padding: 11px 8px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.notes { margin: 0; padding-left: 20px; }
.notes li { margin-bottom: 8px; max-width: 65ch; }
.other { list-style: none; margin: 0; padding: 0; columns: 2 220px; font-size: 14px; }
.other li { break-inside: avoid; padding: 4px 0; }
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.quiet:hover { border-color: var(--aquifer); filter: none; }

/* Year slider: one control drives every number on the district page */
.yearctl { margin: 22px 0 4px; padding: 14px 16px 8px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 12px; }
.yc-top { display: flex; align-items: center; gap: 12px; }
.yc-top label { font-weight: 700; }
.yc-top output { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; margin-right: auto; }
button.small { height: 40px; padding: 0 16px; font-size: 15px; }
.yearctl input[type="range"] { width: 100%; height: 40px; margin: 8px 0 0; accent-color: var(--aquifer); cursor: pointer; }
.yc-ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 2px; }

/* The glass: fills toward New York's limit (the dashed line) */
.glass { display: block; justify-self: center; overflow: visible; }
.glass .fill { fill: var(--aquifer); transform-box: fill-box; transform-origin: 50% 100%; transition: transform 300ms cubic-bezier(0.25, 1, 0.5, 1); }
.glass .fill.watch { fill: var(--watch); }
.glass .fill.over { fill: var(--over); }
.glass .lim { stroke: var(--over); stroke-width: 1.5; stroke-dasharray: 3 2; }
.glass .rim { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
.glass-key { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); margin: 14px 0 0; }
.glass-key .glass { justify-self: auto; }

/* Tap-to-explain words */
.terms { margin-top: 24px; }
.terms-q { font-weight: 700; display: block; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button.term { height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); font-size: 14px; }
button.term:hover { border-color: var(--aquifer); filter: none; }
button.term[aria-expanded="true"] { background: var(--aquifer); color: var(--ground); border-color: var(--aquifer); }
.def { margin: 10px 0 0; padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--aquifer); border-radius: 12px; max-width: 65ch; }

/* Detail: pick a year under the chart */
.pick-years { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
button.yb { height: 40px; padding: 0 12px; background: transparent; color: var(--aquifer); border: 1.5px solid var(--line); font-size: 14px; }
button.yb:hover { border-color: var(--aquifer); filter: none; }
button.yb.on { background: var(--aquifer); color: var(--ground); border-color: var(--aquifer); }
.readout { margin: 12px 0 0; font-size: 17px; max-width: 65ch; }
.chart circle[data-py] { cursor: pointer; }
.cmp-pick { align-items: center; margin-top: 16px; }
.cmp-pick span { color: var(--muted); }
/* Address box with a dropdown of matching addresses */
.combo { position: relative; flex: 1 1 220px; min-width: 0; display: flex; }
.combo input[type="text"] { flex: 1 1 auto; width: 100%; }
.addr-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 1100; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); max-height: 320px; overflow-y: auto; }
.addr-list li { padding: 9px 12px; border-radius: 8px; cursor: pointer; min-height: 44px; }
.addr-list li b { display: block; font-weight: 700; }
.addr-list li small { color: var(--muted); font-size: 14px; }
.addr-list li:hover, .addr-list li[aria-selected="true"] { background: color-mix(in oklab, var(--aquifer) 18%, var(--surface)); }

/* Ranking: chips pick what to rank by; the map and list follow the year slider */
button.chip { height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); font-size: 14px; }
button.chip:hover { border-color: var(--aquifer); filter: none; }
button.chip[aria-pressed="true"] { background: var(--aquifer); color: var(--ground); border-color: var(--aquifer); }
.rank-by { margin-top: 4px; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ranking { list-style: none; margin: 12px 0 0; padding: 0; }
.ranking li + li { border-top: 1px solid var(--rule); }
.ranking button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 10px; width: 100%; padding: 10px 0; cursor: pointer; }
.ranking button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ranking button:hover .rk-name { text-decoration: underline; text-underline-offset: 3px; }
.ranking .rk-n { grid-row: span 2; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.ranking .rk-name { font-weight: 700; }
.ranking [aria-current="true"] .rk-name::after { content: " (this page)"; font-weight: 400; color: var(--muted); }
.ranking .say { font-size: 14px; }

/* Hover a contaminant: what it is linked to */
.log li { position: relative; }
.log .tip { position: absolute; left: 0; bottom: calc(100% - 10px); z-index: 20; max-width: 360px; padding: 10px 12px; border-radius: 8px; background: var(--ink); color: var(--ground); font-size: 14px; line-height: 1.4; opacity: 0; visibility: hidden; transform: translateY(4px); transition: opacity 150ms ease-out, transform 150ms ease-out, visibility 150ms; pointer-events: none; }
.log li:hover .tip, .log li:focus-within .tip { opacity: 1; visibility: visible; transform: none; }
@media (prefers-reduced-motion: reduce) { .log .tip { transition: none; transform: none; } }

/* District map */
.map { height: 340px; margin-top: 12px; border: 1.5px solid var(--rule); border-radius: 12px; position: relative; z-index: 0; background: var(--surface); }
.map-note { margin-top: 8px; }
.leaflet-container { font-family: var(--body); }
.leaflet-tooltip { font-family: var(--body); font-size: 14px; }
/* "New report should be out" note */
.due { margin: 18px 0 0; padding: 12px 14px; border: 1.5px solid var(--watch); border-radius: 10px; background: color-mix(in oklab, var(--watch) 7%, var(--ground)); font-family: var(--small); font-size: 14px; }
.due b { font-family: var(--body); font-size: 16px; display: block; }
.print-only { display: none; }

/* Print: a one-page summary to bring to a district meeting */
@media print {
  @page { margin: 14mm; }
  body { font-size: 11pt; color: #000; background: #fff; }
  .top, .mapsec, .yearctl, .terms, .actions, .glass-key, .log .tip, .back, .pick-years, .band.ground, .no-print { display: none !important; }
  .print-only { display: block !important; }
  .band { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000; }
  .band small { color: #333 !important; }
  .band .wrap { padding-block: 0 8px !important; }
  .wrap { max-width: none; padding: 0; }
  .log li { break-inside: avoid; }
  .log button { padding: 6px 0; }
  .glass, .say, .chart svg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .chart polyline.series { animation: none !important; stroke-dashoffset: 0 !important; }
  .foot a[href^="http"]::after, .print-only a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 8pt; word-break: break-all; }
  .due { border-color: #000; background: #fff; }
}
@media (prefers-reduced-motion: reduce) { .glass .fill { transition: none; } }
@media (prefers-reduced-motion: no-preference) {
  .chart polyline.series { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 900ms ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}
</style>

or 58 certification that lists PFOA. Under-sink reverse osmosis and certified carbon block filters work best.","linked":"Linked to: kidney and testicular cancer, thyroid disease, high cholesterol, weaker vaccine response. From: nonstick and stain-proof coatings, firefighting foam."},"pfos":{"name":"PFOS (a PFAS \"forever chemical\")","unit":"ng/L (ppt)","nyLimit":10,"fedLimit":4,"fedNote":"EPA set a 4 ppt limit in 2024. In May 2026 EPA proposed letting systems take until April 2031 to comply.","what":"A PFAS chemical once used in Scotchgard-type coatings and firefighting foam.","why":"Long-term exposure is linked to immune, thyroid and developmental effects.","fix":"Same treatment as PFOA: granular activated carbon (GAC) or ion exchange at the well.","filter":"Look for NSF/ANSI 53 or 58 certification that lists PFOS.","linked":"Linked to: immune and thyroid effects, high cholesterol, lower birth weight. From: stain-proof coatings, firefighting foam."},"nitrate":{"name":"Nitrate","unit":"mg/L (ppm)","nyLimit":10,"fedLimit":10,"fedNote":"Same 10 mg/L limit at the state and federal level.","what":"Comes mostly from lawn fertilizer and septic or cesspool systems seeping into groundwater.","why":"The main risk is to babies under six months, whose blood can carry less oxygen at high levels. Above half the limit, reports must include an infant warning.","fix":"Districts treat it with ion exchange or blend water from cleaner wells.","filter":"Carbon filters do not remove nitrate. Reverse osmosis certified to NSF/ANSI 58 for nitrate does.","linked":"Linked to: blue baby syndrome in infants under 6 months. From: lawn fertilizer, cesspools and septic systems."},"lead":{"name":"Lead (90th percentile at homes)","unit":"µg/L (ppb)","nyLimit":15,"fedLimit":15,"fedNote":"15 ppb is an action level, not a limit. EPA's 2024 lead rule lowers it to 10 ppb starting in 2027. The health goal is zero.","what":"Lead comes from old pipes and plumbing inside homes and service lines, not usuall <script>
(function () {

  // Plain-language explanations behind the "What do these words mean?" buttons.

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function byId(id) { for (var i = 0; i < D.districts.length; i++) if (D.districts[i].id === id) return D.districts[i]; return null; }
  function byPws(p) { for (var i = 0; i < D.districts.length; i++) if (D.districts[i].pwsid === p) return D.districts[i]; return null; }
  function other(p) { for (var i = 0; i < D.otherDistricts.length; i++) if (D.otherDistricts[i].pwsid === p) return D.otherDistricts[i]; return null; }

  function latestYear(d) { return years(d.reports).pop(); }

  function upTo(d, y) {
    var o = {}, k, c, x;
    for (k in d) o[k] = d[k];
    o.series = {};
    for (c in d.series) { o.series[c] = {}; for (x in d.series[c]) if (x <= y) o.series[c][x] = d.series[c][x]; }

    for (x in d.reports) if (x <= y) o.reports[x] = d.reports[x];

  }

  // Status of the latest value against the New York limit, then the federal one.
  function status(key, d) {

    var y = ys[ys.length - 1], v = s[y], latestReport = latestYear(d);

  function fillScale(st) { return !st.latest || st.latest.stale ? 0 : Math.min(st.r, 1.3) / 1.3; }

  // A glass that fills toward the dashed line (New York's limit). Above the line means over.
  function glass(id, st, label) {

  }

  function term(k, label) { return '<button type="button" class="term" data-term="' + k + '" aria-expanded="false" aria-controls="def">' + esc(label || GLOSS[k][0]) + "</button>"; }

  }
  function toggleTerm(b) {
    var def = document.getElementById("def"), open = b.getAttribute("aria-expanded") === "true";
    app.querySelectorAll(".term").forEach(function (t) { t.setAttribute("aria-expanded", "false"); });
    if (!def) return;
    if (open) { def.hidden = true; return; }
    b.setAttribute("aria-expanded", "true");
    var g = GLOSS[b.dataset.term];
    def.innerHTML = "<b>" + esc(g[0]) + ".</b> " + esc(g[1]);
    def.hidden = false;
  }

  // Short status summary, e.g. "Over limit: 1,4-Dioxane. Watch: Nitrate. OK: PFOA, PFOS, Lead."
  function verdict(d) {
    var groups = { over: [], watch: [], good: [], quietc: [] }, NAME = { dioxane: "1,4-Dioxane", nitrate: "Nitrate", pfoa: "PFOA", pfos: "PFOS", lead: "Lead" };
    ORDER.forEach(function (k) { groups[status(k, d).tone].push(NAME[k]); });
    var out = [];
    if (groups.over.length) out.push("Over limit: " + groups.over.join(", ") + ".");
    if (groups.watch.length) out.push("Watch: " + groups.watch.join(", ") + ".");
    if (groups.good.length) out.push("OK: " + groups.good.join(", ") + ".");
    if (groups.quietc.length) out.push("Not listed: " + groups.quietc.join(", ") + ".");
    return out.join(" ");
  }

  // Full trend chart. series: [{name, s, color}]. hi: a year to ring (single-series only).
  function chart(key, series, label, hi) {
    var c = C[key], W = 360, H = 250, L = 38, R = 14, T = 18, B = 40;
    var all = {}; series.forEach(function (x) { years(x.s).forEach(function (y) { all[y] = 1; }); });
    var ys = Object.keys(all).sort(); if (!ys.length) return "<p>No results to chart.</p>";
    var y0 = +ys[0], y1 = Math.max(+ys[ys.length - 1], y0 + 1);
    var mx = c.nyLimit; series.forEach(function (x) { years(x.s).forEach(function (y) { if (x.s[y] > mx) mx = x.s[y]; }); });
    var step = mx > 40 ? 10 : mx > 15 ? 5 : mx > 6 ? 2 : 1; mx = Math.ceil(mx * 1.1 / step) * step;
    function X(y) { return L + (y - y0) / (y1 - y0) * (W - L - R); }
    function Y(v) { return T + (1 - v / mx) * (H - T - B); }
    var g = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">';

      g += '<text x="' + (L - 6) + '" y="' + (Y(t) + 4).toFixed(1) + '" font-size="11" text-anchor="end" fill="var(--muted)">' + t + "</text>";
    }
    var lab = Math.max(1, Math.ceil((y1 - y0) / 4));
    for (var yy = y0; yy <= y1; yy += lab) g += '<text x="' + X(yy).toFixed(1) + '" y="' + (H - B + 18) + '" font-size="11" text-anchor="middle" fill="var(--muted)">' + yy + "</text>";
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(c.nyLimit).toFixed(1) + '" y2="' + Y(c.nyLimit).toFixed(1) + '" stroke="var(--over)" stroke-width="2" stroke-dasharray="6 4"/>';
    if (c.fedLimit && c.fedLimit !== c.nyLimit) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(c.fedLimit).toFixed(1) + '" y2="' + Y(c.fedLimit).toFixed(1) + '" stroke="var(--watch)" stroke-width="2" stroke-dasharray="2 4"/>';
    series.forEach(function (x) {
      var k = years(x.s), pts = k.map(function (y) { return X(+y).toFixed(1) + "," + Y(x.s[y]).toFixed(1); });

      if (k.length > 1) g += '<polyline class="series" style="--len:' + Math.ceil(len) + '" points="' + pts.join(" ") + '" fill="none" stroke="' + x.color + '" stroke-width="3" stroke-linejoin="round"/>';
      k.forEach(function (y) {
        var one = series.length === 1;
        if (one && y === hi) g += '<circle cx="' + X(+y).toFixed(1) + '" cy="' + Y(x.s[y]).toFixed(1) + '" r="9" fill="none" stroke="var(--ink)" stroke-width="2"/>';
        g += '<circle cx="' + X(+y).toFixed(1) + '" cy="' + Y(x.s[y]).toFixed(1) + '" r="' + (one ? 6 : 4) + '" fill="' + x.color + '"' + (one ? ' data-py="' + y + '"' : "") + "><title>" + esc(x.name + " " + y + ": " + fmt(x.s[y]) + " " + UNIT[key]) + "</title></circle>";
      });
      if (series.length === 1) {
        var pk = k[0]; k.forEach(function (y) { if (x.s[y] > x.s[pk]) pk = y; }); var ls = k[k.length - 1];
        [pk, ls].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (y) {
          var ty = Y(x.s[y]) - 10; if (ty < 12) ty = Y(x.s[y]) + 18;
          g += '<text x="' + Math.min(Math.max(X(+y), L + 12), W - R - 12).toFixed(1) + '" y="' + ty.toFixed(1) + '" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">' + fmt(x.s[y]) + "</text>";
        });
      }
    });
    g += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="var(--muted)">' + esc(c.unit) + ", highest result at any well that year</text>";
    return g + "</svg>";
  }

  function strata(d) {
    var lloyd = /Lloyd/.test(d.wells), txt = d.wells;
    return '<svg class="strata" viewBox="0 0 640 120" preserveAspectRatio="none" role="img" aria-label="Ground under the district: ' + esc(txt) + '">' +
      '<rect x="0" y="0" width="640" height="20" fill="var(--topsoil)"/><rect x="0" y="20" width="640" height="30" fill="var(--sand)"/>' +
      '<rect x="0" y="50" width="640" height="44" fill="var(--magothy)"/><rect x="0" y="94" width="640" height="8" fill="var(--clay)"/><rect x="0" y="102" width="640" height="18" fill="var(--lloyd)"/>' +
      '<g stroke="#F2F5F4" stroke-width="2">' + [120, 200, 280, 360, 440].map(function (x, i) { return '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (76 + (i % 2) * 6) + '"/>'; }).join("") + (lloyd ? '<line x1="540" y1="0" x2="540" y2="114"/>' : "") + "</g></svg>" +
      '<div class="row" style="justify-content:space-between;font-size:13px;color:var(--band-muted);padding-block:8px 18px"><span>White lines are the district\'s wells' + (lloyd ? ". One reaches the Lloyd" : "") + '</span><span>' + esc(txt) + "</span></div>";
  }

  function districtOptions(sel) {
    var h = '<option value="">Pick a water district</option><optgroup label="With full history">';
    D.districts.forEach(function (d) { h += '<option value="' + d.id + '"' + (sel === d.id ? " selected" : "") + ">" + esc(d.name) + "</option>"; });
    h += '</optgroup><optgroup label="Coming soon">';
    D.otherDistricts.forEach(function (d) { h += '<option value="pws:' + d.pwsid + '">' + esc(d.name) + "</option>"; });
    return h + "</optgroup>";
  }

  function header() {
    return '<div class="wrap top"><div class="brand"><b>TapTrack</b><span>Long Island tap water, year by year. Free.</span></div>' +
      '<form class="find" id="find" autocomplete="off"><label for="addr">Your address</label><div class="row"><div class="combo"><input type="text" id="addr" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="addr-list" autocomplete="off" placeholder="Start typing, e.g. 100 Main St"><ul class="addr-list" id="addr-list" role="listbox" aria-label="Matching addresses" hidden></ul></div><button type="submit">Find my water</button></div>' +
      '<label for="pick" style="margin-top:12px">Or pick your district</label><div class="row"><select id="pick">' + districtOptions(state.district) + "</select></div>" +
      '<p class="msg' + (state.msgErr ? " err" : "") + '" id="msg" role="status">' + esc(state.msg) + "</p></form></div>";
  }

  function home() {
    var d = byId(state.district);
    if (!d) {
      return header() + '<div class="wrap"><h2 style="font-size:24px;margin-top:8px">See what is in your tap water, and how it has changed.</h2><p class="basis" style="margin-top:10px">Every water district puts out a yearly report as a PDF. TapTrack reads them for you and lines the years up side by side, in plain words, with a link to every report.</p>' +
        mapHTML(state.pin ? "Your address on the map" : "Find your district on the map") +
        '<div class="actions">' + D.districts.map(function (x, i) { return '<button type="button"' + (i ? ' class="quiet"' : "") + ' data-go="' + x.id + '">See ' + esc(x.name) + "</button>"; }).join("") + "</div>" +
        foot(null) + "</div>";
    }
    var dv = upTo(d, state.year);
    var rows = ORDER.map(function (k) {
      var st = status(k, dv);
      return '<li data-row="' + k + '"><button type="button" data-key="' + k + '" aria-describedby="tip-' + k + '" aria-label="' + esc(rowLabel(k, st)) + '"><span><span class="name">' + SHORT[k] + '</span><span class="say ' + st.tone + '">' + esc(st.say) + "</span></span>" +
        glass(k, st) + '<span class="val num"><strong>' + valText(st) + "</strong><em>" + UNIT[k] + '</em></span></button><span class="tip" role="tooltip" id="tip-' + k + '">' + esc(C[k].linked) + "</span></li>";
    }).join("");
    // Page order: district name, map, year slider, the data, then the aquifer breakdown.
    return header() +
      '<div class="band"><div class="wrap" style="padding-bottom:22px"><small>Your water comes from</small><h1>' + esc(d.name) + '</h1><small class="num">' + d.population.toLocaleString() + " people. District ID " + d.pwsid + "</small></div></div>" +
      '<div class="wrap">' + dueBanner(d, new Date()) + mapHTML("Where " + d.name + " is") + yearCtl(d) +
      '<p class="verdict" id="verdict" aria-live="polite">' + esc(verdict(dv)) + '</p><p class="basis" id="basis">' + basis(d) + "</p>" +
      '<ul class="log">' + rows + "</ul>" +
      '<p class="glass-key">' + glass("key", { tone: "good", latest: { v: 1 }, r: 0.5 }) + "<span>Glass = share of NY limit. Dashed line = limit. Tap a row for every year.</span></p>" +
      termBar(["highest", "limit", "nd", "ppb", "ppt", "ppm", "p90"]) +
      '<div class="actions"><button type="button" data-view="filter">Do I need a filter?</button><button type="button" class="quiet" data-view="compare">Compare with another district</button>' +
      '<button type="button" class="quiet" data-print>Print a summary</button><button type="button" class="quiet" data-share>Copy link to this page</button></div>' +
      printExtras(d) + "</div>" +
      '<section class="band ground" aria-labelledby="ground-h"><div class="wrap"><h2 id="ground-h">Where your water comes from underground</h2>' +
      "<p>Long Island gets all its tap water from wells drilled into layers of sand deep underground, called aquifers. Rain soaks down through them over years, so what goes on the ground, like fertilizer, cesspools and old spills, can end up in the water.</p>" +
      '<dl class="layers"><div><dt><i style="background:var(--sand)"></i>Upper glacial</dt><dd>Closest to the surface. Easiest for pollution to reach.</dd></div>' +
      '<div><dt><i style="background:var(--magothy)"></i>Magothy</dt><dd>The main layer, a few hundred feet down. Most Long Island wells pump from here.</dd></div>' +
      '<div><dt><i style="background:var(--lloyd)"></i>Lloyd</dt><dd>The deepest and oldest water, under a clay layer that helps protect it.</dd></div></dl>' +
      strata(d) + "</div></section>" +
      '<div class="wrap">' + foot(d) + "</div>";
  }
  // Reports for year Y come out by June 1 of Y+1. So after June 1, last year's report should be posted.
  function expectedYear(now) { return String(now.getMonth() >= 5 ? now.getFullYear() - 1 : now.getFullYear() - 2); }
  function dueBanner(d, now) {
    var exp = expectedYear(now), last = latestYear(d);
    if (last >= exp) return "";
    return '<div class="due" role="note"><b>The ' + exp + " report should be out.</b>Districts post each year's report by June 1 of the next year. TapTrack has reports up to " + last + '. <a href="' + d.reportsPage + '" target="_blank" rel="noopener">Check the district\'s reports page</a>.</div>';
  }
  // Only on paper: what to ask the district about, and how to reach it.
  function printExtras(d) {
    return '<section class="print-only"><h2>Questions to ask the district</h2><ul class="notes">' + d.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" +
      "<p>" + (d.phone ? "Phone " + esc(d.phone) + ". " : "") + 'Reports: <a href="' + d.reportsPage + '">' + esc(d.reportsPage) + "</a></p>" +
      "<p>Printed from TapTrack on " + new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) + ". " + esc(location.href.split("?")[0]) + "</p></section>";
  }
  function rowLabel(k, st) { return SHORT[k] + ": " + valText(st) + " " + UNIT[k] + ". " + st.say + " Open every year."; }
  function basis(d) {
    var y = state.year;
    return d.reports[y] ? "Highest result, " + y + " (worst well)." : "No " + y + " report posted. Showing latest before " + y + ".";
  }
  function yearCtl(d) {
    var ys = years(d.reports), lo = +ys[0], hi = +ys[ys.length - 1], ticks = "";
    for (var y = lo; y <= hi; y++) ticks += "<span>" + ("'" + String(y).slice(2)) + "</span>";
    return '<div class="yearctl"><div class="yc-top"><label for="yr">Year</label><output id="yr-out" class="num" for="yr">' + state.year + "</output>" +
      '<button type="button" class="quiet small" data-play aria-pressed="false">Play the years</button></div>' +
      '<input type="range" id="yr" min="' + lo + '" max="' + hi + '" step="1" value="' + state.year + '" aria-valuetext="' + state.year + '">' +
      '<div class="yc-ticks" aria-hidden="true">' + ticks + "</div></div>";
  }
  // Move the whole district page to year y without rebuilding it, so the glasses animate.
  function setYear(y) {
    var d = byId(state.district); if (!d) return;
    state.year = String(y);
    var dv = upTo(d, state.year), el;
    if ((el = document.getElementById("yr-out"))) el.textContent = state.year;
    if ((el = document.getElementById("yr"))) { el.value = state.year; el.setAttribute("aria-valuetext", state.year); }
    if ((el = document.getElementById("verdict"))) el.textContent = verdict(dv);
    if ((el = document.getElementById("basis"))) el.textContent = basis(d);
    if ((el = document.getElementById("src"))) { var sy = d.reports[state.year] ? state.year : latestYear(dv) || latestYear(d); el.href = d.reports[sy]; el.textContent = d.name + " " + sy + " report"; }
    ORDER.forEach(function (k) {
      var li = app.querySelector('[data-row="' + k + '"]'); if (!li) return;
      var st = status(k, dv), say = li.querySelector(".say"), f = li.querySelector(".fill");
      say.className = "say " + st.tone; say.textContent = st.say;
      li.querySelector("strong").textContent = valText(st);
      li.querySelector("button").setAttribute("aria-label", rowLabel(k, st));
      f.setAttribute("class", "fill " + st.tone); f.style.transform = "scaleY(" + fillScale(st).toFixed(3) + ")";
    });
    refreshRanking();
  }
  function stopPlay() {
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
    var b = app.querySelector("[data-play]"); if (b) { b.setAttribute("aria-pressed", "false"); b.textContent = "Play the years"; }
  }
  function togglePlay(b) {
    if (playTimer) { stopPlay(); return; }
    var r = document.getElementById("yr"); if (!r) return;
    if (+r.value >= +r.max) setYear(r.min);
    b.setAttribute("aria-pressed", "true"); b.textContent = "Pause";
    playTimer = setInterval(function () {
      var cur = document.getElementById("yr");
      if (!cur || +cur.value >= +cur.max) { stopPlay(); return; }
      setYear(+cur.value + 1);
    }, 1200);
  }

  function foot(d) {
    var h = '<div class="foot">';
    if (d) {
      var ly = state.view === "home" && d.reports[state.year] ? state.year : latestYear(d);
      h += '<div>Source: <a id="src" href="' + d.reports[ly] + '" target="_blank" rel="noopener">' + esc(d.name) + " " + ly + ' report</a>. <button type="button" class="back" style="padding:0" data-view="notes">Report errors we found (' + d.notes.length + ")</button></div>";
    }
    h += "<div>" + esc(D.meta.valueRule) + " Not medical advice.</div>";
    h += '<div>District boundaries: <a href="https://www.epa.gov/ground-water-and-drinking-water/community-water-system-service-area-boundaries" target="_blank" rel="noopener">EPA service area map</a>. Limits: New York State Department of Health and EPA. Street map and address search: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> and Photon by komoot.</div></div>';
    return h;
  }

  function detail() {
    var d = byId(state.district), k = state.key, c = C[k], s = d.series[k], st = status(k, d);
    var ys = years(s);
    var py = state.pickYear && s[state.pickYear] !== undefined ? state.pickYear : ys[ys.length - 1];
    var label = "Highest " + c.name + " result by year in " + d.name + ": " + ys.map(function (y) { return y + " " + fmt(s[y]); }).join(", ") + ". New York limit " + c.nyLimit + ".";
    var tl = (k === "dioxane" || k === "pfoa" || k === "pfos") ? d.timeline : [];
    return '<div class="wrap detail" style="padding-block:8px 0"><button type="button" class="back" data-view="home">Back to ' + esc(d.name) + "</button>" +
      "<h1>" + esc(c.name) + '</h1><p class="lede ' + st.tone + '">' + esc(st.say) + "</p>" +
      '<div class="chart">' + chart(k, [{ name: d.name, s: s, color: "var(--aquifer)" }], label, py) + "</div>" +
      '<div class="legend"><span><i class="series"></i>' + esc(d.name) + '</span><span><i></i>New York limit ' + c.nyLimit + "</span>" + (c.fedLimit && c.fedLimit !== c.nyLimit ? '<span><i class="fed"></i>' + (k === "lead" ? "EPA level from 2027: " : "EPA limit: ") + c.fedLimit + "</span>" : "") + "</div>" +
      (ys.length ? '<div class="pick-years" role="group" aria-label="Pick a year">' + ys.map(function (y) { return '<button type="button" class="yb' + (y === py ? " on" : "") + '" data-py="' + y + '" aria-pressed="' + (y === py) + '">' + y + "</button>"; }).join("") + "</div>" + readout(d, k, py) : "") +
      termBar([UNIT_TERM[k], "nd"].concat(k === "lead" ? ["p90", "action"] : ["limit", "highest"])) +
      (tl.length ? '<section><h2>What the district did</h2><ol class="steps">' + tl.map(function (t) { return "<li><b>" + esc(t.date) + "</b><span>" + esc(t.text) + "</span></li>"; }).join("") + "</ol></section>" : "") +
      "<section><h2>What is it?</h2><p>" + esc(c.what) + "</p><h2>Should I worry?</h2><p>" + esc(c.why) + "</p><h2>How does it get fixed?</h2><p>" + esc(c.fix) + "</p><h2>Can a home filter help?</h2><p>" + esc(c.filter) + "</p><h2>What are the limits?</h2><p>" + esc(c.fedNote) + "</p></section>" +
      '<section><h2>Every year, from the source</h2><div class="years">' + years(d.reports).map(function (y) { return '<a href="' + d.reports[y] + '" target="_blank" rel="noopener">' + y + (s[y] !== undefined ? ": " + fmt(s[y]) : ": not listed") + "</a>"; }).join("") + "</div></section>" +
      '<div class="actions"><button type="button" class="quiet" data-print>Print this page</button><button type="button" class="quiet" data-share>Copy link to this page</button></div>' +
      foot(d) + "</div>";
  }

  // One year's value in words, with the report it came from.
  function readout(d, k, y) {
    var v = d.series[k][y], c = C[k];
    var rep = d.reports[y] ? y : years(d.reports).filter(function (x) { return x > y; })[0];
    var words = k === "lead" ? "90th pct · AL 15" : v === 0 ? "not detected" : pct(v / c.nyLimit) + " (NY " + c.nyLimit + ")";
    return '<p class="readout" aria-live="polite"><b>' + y + ":</b> " + fmt(v) + " " + UNIT[k] + " · " + esc(words) +
      (rep ? ' · <a href="' + d.reports[rep] + '" target="_blank" rel="noopener">' + rep + " report</a>" : "") + "</p>";
  }

  function filterRec(cn) {
    var n = cn.nitrate || cn.baby, p = cn.pfas, l = cn.lead;
    if (!n && !p && !l && !cn.dioxane) return { t: "Pick at least one", b: "Choose what you want to reduce and TapTrack shows the filter type to look for." };
    if (n) return { t: "Under-sink reverse osmosis", b: "Carbon filters do not remove nitrate. Look for NSF/ANSI 58 certification that lists nitrate" + (p ? " and PFOA/PFOS" : "") + (l ? " and lead" : "") + " by name." };
    if (p) return { t: "Certified carbon block or reverse osmosis", b: "Look for NSF/ANSI 53 or 58 certification that lists PFOA and PFOS by name" + (l ? ", and lead" : "") + ". An under-sink carbon block costs less than reverse osmosis." };
    if (l) return { t: "Certified pitcher or faucet filter", b: "Many pitchers are certified to NSF/ANSI 53 for lead. Also run the cold tap 30 seconds to 2 minutes if the water sat overnight." };
    return { t: "Rely on the district's treatment", b: C.dioxane.filter + " " + C.dioxane.fix };
  }

  function filter() {
    var d = byId(state.district), cn = state.concerns, r = filterRec(cn);
    var st = {}; ORDER.forEach(function (k) { st[k] = status(k, d); });
    var meets = ORDER.every(function (k) { return st[k].tone !== "over"; });
    function pick(id, label, note) { return '<label class="pick"><input type="checkbox" data-concern="' + id + '"' + (cn[id] ? " checked" : "") + "><span>" + label + "</span>" + (note ? "<small>" + esc(note) + "</small>" : "") + "</label>"; }
    return '<div class="wrap detail" style="padding-block:8px 0"><button type="button" class="back" data-view="home">Back to ' + esc(d.name) + "</button><h1>Do I need a filter?</h1>" +
      '<p class="lede">' + (meets ? "Your water meets New York's limits. A filter is a choice, not a requirement." : "Something in your water is above New York's limit. Check the district's notice for what to do now.") + "</p>" +
      "<fieldset><legend>I want to reduce</legend>" +
      pick("pfas", "PFAS (PFOA, PFOS)", st.pfoa.latest ? "Latest " + fmt(st.pfoa.latest.v) + " ppt" : "") +
      pick("nitrate", "Nitrate", st.nitrate.latest ? "Latest " + fmt(st.nitrate.latest.v) + " mg/L" : "") +
      pick("baby", "Nitrate, I have a baby under 6 months", "") +
      pick("lead", "Lead from old pipes", "") +
      pick("dioxane", "1,4-Dioxane", "") + "</fieldset>" +
      '<div class="answer" aria-live="polite"><small>Look for</small><h2>' + esc(r.t) + "</h2><div>" + esc(r.b) + "</div></div>" +
      '<section><h2>What each filter type removes</h2><div class="tablebox"><table><thead><tr><th>Filter</th><th>Nitrate</th><th>PFAS</th><th>Lead</th><th>1,4-Dioxane</th></tr></thead><tbody>' +
      "<tr><td>Pitcher, carbon</td><td>No</td><td>Some, if NSF 53 lists it</td><td>Yes, if NSF 53</td><td>No</td></tr>" +
      "<tr><td>Carbon block, under sink</td><td>No</td><td>Yes, if NSF 53</td><td>Yes, if NSF 53</td><td>Limited</td></tr>" +
      "<tr><td>Reverse osmosis</td><td>Yes, if NSF 58</td><td>Yes, if NSF 58</td><td>Yes, if NSF 58</td><td>Partial</td></tr>" +
      '</tbody></table></div><p style="margin-top:12px;font-size:14px;color:var(--muted)">Check a model on <a href="https://info.nsf.org/Certified/DWTU/" target="_blank" rel="noopener">NSF\'s certified product list</a>. TapTrack has no ads and no affiliate links.</p></section>' +
      foot(d) + "</div>";
  }

  function compare() {
    var a = byId(state.cmpA) || byId(state.district) || D.districts[0];
    var b = byId(state.cmpB); if (!b || b === a) b = D.districts.filter(function (x) { return x !== a; })[0];
    var k = state.compareKey, c = C[k];
    function pick(which, sel) { return '<select data-cmp="' + which + '" aria-label="' + (which === "A" ? "First" : "Second") + ' district">' + D.districts.map(function (x) { return '<option value="' + x.id + '"' + (x === sel ? " selected" : "") + ">" + esc(x.name) + "</option>"; }).join("") + "</select>"; }
    var tabs = ORDER.filter(function (x) { return x !== "lead"; }).map(function (x) { return '<button type="button" class="' + (x === k ? "" : "quiet") + '" data-ck="' + x + '" aria-pressed="' + (x === k) + '">' + SHORT[x] + "</button>"; }).join("");
    var label = c.name + " by year. " + a.name + ": " + years(a.series[k]).map(function (y) { return y + " " + fmt(a.series[k][y]); }).join(", ") + ". " + b.name + ": " + years(b.series[k]).map(function (y) { return y + " " + fmt(b.series[k][y]); }).join(", ") + ".";
    return '<div class="wrap detail" style="padding-block:8px 0"><button type="button" class="back" data-view="home">Back</button><h1>Compare districts</h1>' +
      '<p class="lede">Two neighbors, same aquifer, different paths. Pick any two.</p><div class="row cmp-pick">' + pick("A", a) + "<span>and</span>" + pick("B", b) + "</div>" +
      '<div class="actions" role="group" aria-label="Contaminant">' + tabs + "</div>" +
      '<div class="chart">' + chart(k, [{ name: a.name, s: a.series[k], color: "var(--aquifer)" }, { name: b.name, s: b.series[k], color: "var(--watch)" }], label) + "</div>" +
      '<div class="legend"><span><i class="series"></i>' + esc(a.name) + '</span><span><i class="series2"></i>' + esc(b.name) + '</span><span><i></i>New York limit ' + c.nyLimit + "</span></div>" +
      '<section><h2>Latest results</h2><div class="tablebox"><table><thead><tr><th>Contaminant</th><th>' + esc(a.name) + "</th><th>" + esc(b.name) + "</th></tr></thead><tbody>" +
      ORDER.map(function (x) { var sa = status(x, a), sb = status(x, b); return "<tr><td>" + SHORT[x] + ' (' + UNIT[x] + ')</td><td class="num ' + sa.tone + '">' + (sa.latest ? (sa.latest.stale ? "ND" : fmt(sa.latest.v)) : "n/a") + '</td><td class="num ' + sb.tone + '">' + (sb.latest ? (sb.latest.stale ? "ND" : fmt(sb.latest.v)) : "n/a") + "</td></tr>"; }).join("") +
      "</tbody></table></div></section>" + foot(null) + "</div>";
  }

  function notes() {
    var d = byId(state.district);
    return '<div class="wrap detail" style="padding-block:8px 0"><button type="button" class="back" data-view="home">Back to ' + esc(d.name) + "</button><h1>Report errors we found</h1>" +
      '<p class="lede">Reading every year side by side shows mistakes a single report hides. Ask the district about these.</p><section><ul class="notes">' + d.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></section>" +
      "<section><h2>Contact the district</h2><p>" + (d.phone ? 'Call <span class="num" style="user-select:all">' + esc(d.phone) + "</span> or see " : "See ") + '<a href="' + d.reportsPage + '" target="_blank" rel="noopener">its reports page</a>.</p></section>' +
      "<section><h2>Other NY-03 districts</h2><p>Full history for these is coming next. Their reports are public now.</p><ul class=\"other\">" +
      D.otherDistricts.map(function (o) { return "<li>" + (o.reportsPage ? '<a href="' + o.reportsPage + '" target="_blank" rel="noopener">' + esc(o.name) + "</a>" : esc(o.name)) + ' <span class="num quietc">' + o.population.toLocaleString() + "</span></li>"; }).join("") + "</ul></section>" + foot(d) + "</div>";
  }

  function render() {
    var v = state.view;
    if (v !== "home" && v !== "compare" && !byId(state.district)) v = "home";
    if (mapObj) { mapObj.remove(); mapObj = null; geoLayer = null; } // before its container is replaced
    app.innerHTML = v === "detail" ? detail() : v === "filter" ? filter() : v === "compare" ? compare() : v === "notes" ? notes() : home();
    initMap();
  }
  function go(view, extra) { stopPlay(); state.view = view; for (var k in extra || {}) state[k] = extra[k]; render(); syncHash(true); window.scrollTo(0, 0); }

  // ---- Shareable links: #jericho, #jericho-dioxane, #jericho-filter, #jericho-notes, #compare ----
  var PAGES = ["filter", "compare", "notes"], lastHash = null;
  function hashFor() {
    var d = byId(state.district);
    if (state.view === "compare") return d ? d.id + "-compare" : "compare";
    if (!d) return "";
    if (state.view === "detail") return d.id + "-" + state.key;
    return PAGES.indexOf(state.view) >= 0 ? d.id + "-" + state.view : d.id;
  }
  function syncHash(push) {
    var h = hashFor();
    lastHash = h;
    if (h === (location.hash || "").slice(1)) return;
    try { history[push ? "pushState" : "replaceState"](null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {}
  }
  // Open whatever the link points to. Runs on load, on Back/Forward, and when someone edits the link.
  function applyHash() {
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (h === lastHash) return;
    lastHash = h;
    var cut = h.indexOf("-"), d = byId(cut < 0 ? h : h.slice(0, cut)), rest = cut < 0 ? "" : h.slice(cut + 1);
    stopPlay();
    if (h === "compare") state.view = "compare";
    else if (!d) state.view = "home";
    else {
      if (state.district !== d.id) { state.district = d.id; state.year = latestYear(d); state.pin = null; state.cmpA = null; state.cmpB = null; save(); }
      if (C[rest]) { state.view = "detail"; state.key = rest; state.pickYear = null; }
      else state.view = PAGES.indexOf(rest) >= 0 ? rest : "home";
    }
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", applyHash);
  window.addEventListener("hashchange", applyHash);
  function copyLink(b) {
    var url = location.href, done = function () { b.textContent = "Link copied"; setTimeout(function () { b.textContent = "Copy link to this page"; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Copy this link:", url); });
    else window.prompt("Copy this link:", url);
  }
  function setMsg(m, err) { state.msg = m; state.msgErr = !!err; var el = document.getElementById("msg"); if (el) { el.textContent = m; el.className = "msg" + (err ? " err" : ""); } }
  function choose(val) {
    if (!val) return;
    if (val.indexOf("pws:") === 0) {
      var o = other(val.slice(4));
      state.district = null; save();
      go("home", { msg: o ? o.name + " is not added yet. Its full history is coming next. Try Jericho or Plainview to see how TapTrack works." : "", msgErr: false });
      return;
    }
    var d = byId(val); if (!d) return;
    state.district = val; save(); go("home", { msg: "", msgErr: false, year: latestYear(d), cmpA: null, cmpB: null, pin: null });
  }

  // ---- Which district is an address in? ----
  // District outlines come from EPA's service area map (data/boundaries.geojson), so the lookup runs in the browser.
  function inRing(x, y, ring) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function districtAt(lon, lat) {
    for (var i = 0; i < B.features.length; i++) {
      var g = B.features[i].geometry, polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
      for (var p = 0; p < polys.length; p++) {
        if (!inRing(lon, lat, polys[p][0])) continue;
        var hole = false; for (var h = 1; h < polys[p].length; h++) if (inRing(lon, lat, polys[p][h])) hole = true;
        if (!hole) return B.features[i].properties.pwsid;
      }
    }
    return null;
  }
  window.TapTrack = { districtAt: districtAt }; // used by tests

  function lookupPoint(lon, lat, label) {
    var id = districtAt(lon, lat), d = id && byPws(id), o = id && other(id);
    state.pin = [lat, lon];
    if (d) { state.district = d.id; save(); go("home", { msg: "Found: " + d.name + ".", msgErr: false, year: latestYear(d) }); return; }
    if (o) { state.district = null; save(); go("home", { msg: "Your water comes from " + o.name + ". Its full history is coming next. It is outlined on the map below.", msgErr: false }); return; }
    // Outside the NY-03 districts in TapTrack: ask EPA's boundary map for the system's name.
    setMsg("Checking EPA's map for " + label + "…");
    var url = "https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services/Water_System_Boundaries/FeatureServer/0/query?f=json&returnGeometry=false&outFields=PWSID,PWS_Name&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&geometry=" + lon + "," + lat;
    fetch(url).then(function (r) { return r.json(); }).then(function (res) {
      var f = (res.features || []).map(function (x) { return x.attributes; });
      setMsg(f.length ? "Your water comes from " + f[0].PWS_Name + " (" + f[0].PWSID + "). TapTrack covers NY-03 districts only for now." : "That address is outside the water districts TapTrack knows. Pick your district from the list.", !f.length);
    }).catch(function () { setMsg("That address is outside the NY-03 districts TapTrack covers.", true); });
  }

  // ---- Address dropdown: matching addresses with town and ZIP as you type ----
  // Suggestions come from Photon (komoot), an OpenStreetMap search built for type-ahead. The box limits results to NY-03.
  var sugg = [], active = -1, suggTimer = null, suggSeq = 0;
  var BBOX = "-73.95,40.55,-73.35,40.95";
  function addrParts(p) {
    var street = [p.housenumber, p.street].filter(Boolean).join(" ");
    var line1 = p.name && p.osm_value !== "house" ? p.name + (street ? ", " + street : "") : street || p.name || "";
    var town = p.city || p.district || p.locality || p.county || "";
    return { line1: line1, line2: (town ? town + ", " : "") + "NY" + (p.postcode ? " " + p.postcode : "") };
  }
  function suggest(q) {
    var seq = ++suggSeq;
    if (!window.fetch) return Promise.resolve(null);
    return fetch("https://photon.komoot.io/api/?limit=7&lang=en&bbox=" + BBOX + "&q=" + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error("photon"); return r.json(); })
      .then(function (j) {
        if (seq !== suggSeq) return null; // a newer search is on its way
        var seen = {}, out = [];
        (j.features || []).forEach(function (f) {
          var p = f.properties || {};
          if (!/^(NY|New York)$/.test(p.state || "")) return;
          var a = addrParts(p), key = a.line1 + "|" + a.line2;
          if (!a.line1 || seen[key]) return;
          seen[key] = 1;
          out.push({ line1: a.line1, line2: a.line2, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] });
        });
        return out.slice(0, 6);
      });
  }
  function showList(list) {
    var ul = document.getElementById("addr-list"), input = document.getElementById("addr");
    if (!ul || !input) return;
    sugg = list; active = -1;
    ul.innerHTML = list.map(function (s, i) { return '<li role="option" id="opt-' + i + '" data-opt="' + i + '" aria-selected="false"><b>' + esc(s.line1) + "</b><small>" + esc(s.line2) + "</small></li>"; }).join("");
    ul.hidden = !list.length;
    input.setAttribute("aria-expanded", String(!!list.length));
    input.removeAttribute("aria-activedescendant");
  }
  function hideList() {
    var ul = document.getElementById("addr-list"), input = document.getElementById("addr");
    if (ul) ul.hidden = true;
    if (input) { input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); }
    active = -1;
  }
  function moveActive(step) {
    if (!sugg.length) return;
    active = (active + step + sugg.length) % sugg.length;
    app.querySelectorAll(".addr-list li").forEach(function (li, i) { li.setAttribute("aria-selected", String(i === active)); });
    var el = document.getElementById("opt-" + active);
    document.getElementById("addr").setAttribute("aria-activedescendant", "opt-" + active);
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
  }
  function pickSugg(i) {
    var s = sugg[i], input = document.getElementById("addr"); if (!s) return;
    if (input) input.value = s.line1 + ", " + s.line2;
    hideList();
    lookupPoint(s.lon, s.lat, s.line1);
  }
  function onType(q) {
    clearTimeout(suggTimer);
    if (q.length < 3) { suggSeq++; sugg = []; hideList(); return; }
    suggTimer = setTimeout(function () {
      suggest(q).then(function (list) {
        if (!list) return;
        showList(list);
        setMsg(list.length ? "" : q.length > 5 ? "No matching addresses yet. Keep typing, or add the town." : "", false);
      }).catch(function () { hideList(); });
    }, 300);
  }
  // Pressing "Find my water" without picking from the list.
  function findAddress(q) {
    if (sugg.length === 1) { pickSugg(0); return; }
    setMsg("Looking up " + q + "…");
    suggest(q).then(function (list) {
      if (list === null) throw new Error("photon");
      if (!list.length) { setMsg("No match for that address. Add the town, or pick your district from the list.", true); return; }
      if (list.length === 1) { sugg = list; pickSugg(0); return; }
      showList(list);
      setMsg("More than one place matches. Pick yours from the list.", false);
      document.getElementById("addr").focus();
    }).catch(function () { nominatim(q); });
  }
  // Backup geocoder if Photon is down.
  function nominatim(q) {
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=" + encodeURIComponent(q), { headers: { "Accept": "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("geo"); return r.json(); })
      .then(function (g) { if (!g.length) throw new Error("none"); lookupPoint(+g[0].lon, +g[0].lat, q); })
      .catch(function (e) { setMsg(e.message === "none" ? "No match for that address. Add the town and NY, or pick your district from the list." : "Address search can't reach the map right now. Pick your district from the list.", true); });
  }

  // ---- Ranking: each district's result as a share of its limit ----
  // "Overall" uses the district's worst result that year (the one closest to, or furthest over, its limit). No made-up score.
  var TONE_RANK = { quietc: 0, good: 1, watch: 2, over: 3 };
  var MAX_YEAR = D.districts.map(latestYear).sort().pop();
  function rating(d, key, year) {
    var dv = upTo(d, year), best = null;
    (key === "overall" ? ORDER : [key]).forEach(function (k) {
      var st = status(k, dv); if (!st.latest) return;
      var r = st.latest.stale ? 0 : st.r, n = TONE_RANK[st.tone];
      if (!best || n > best.n || (n === best.n && r > best.r)) best = { k: k, r: r, n: n, tone: st.tone, st: st };
    });
    return best;
  }
  function rankYear() { return state.view === "home" && byId(state.district) ? state.year : MAX_YEAR; }
  function ranked() {
    var y = rankYear();
    return D.districts.map(function (d) { return { d: d, x: rating(d, state.rank, y), last: latestYear(upTo(d, y)) }; })
      .sort(function (a, b) { return !a.x ? 1 : !b.x ? -1 : a.x.n - b.x.n || a.x.r - b.x.r; });
  }
  function rateText(x) {
    if (!x) return "No data for " + rankYear();
    var st = x.st, v = st.latest, k = x.k;
    var what = (state.rank === "overall" ? "worst: " + SHORT[k] + " " : "") + valText(st) + " " + UNIT[k];
    var share = v.stale ? "not listed since " + v.y : k === "lead" ? "90th pct, AL 15" : v.v === 0 ? "not detected" : pct(x.r);
    return (TAG[x.tone] || "Not listed") + " · " + what + " · " + share;
  }
  function rankingHTML() {
    var y = rankYear();
    return ranked().map(function (o, i) {
      var old = o.last && o.last < y ? " · latest report " + o.last : "";
      return '<li><button type="button" data-go="' + o.d.id + '"' + (o.d.id === state.district ? ' aria-current="true"' : "") + '><span class="rk-n">' + (i + 1) + '</span><span class="rk-name">' + esc(o.d.name) + '</span><span class="say ' + (o.x ? o.x.tone : "quietc") + '">' + esc(rateText(o.x) + old) + "</span></button></li>";
    }).join("");
  }
  function rankNote() {
    var y = rankYear();
    return "Ranked for " + y + ", best first. " + (state.rank === "overall" ? "Overall = each district's worst result that year as a share of its limit." : "By the highest " + C[state.rank].name + " result as a share of New York's limit.") +
      " Gray dashed outlines are not in TapTrack yet. Tap a district to open it. Outlines: EPA service area map.";
  }

  // ---- District map (Leaflet + OpenStreetMap, outlines from EPA) ----
  var mapObj = null, geoLayer = null, mapTok = {};
  function mapHTML(title) {
    var keys = ["overall"].concat(ORDER);
    return '<section class="mapsec"><h2>' + esc(title) + '</h2>' +
      '<div class="chips rank-by" role="group" aria-label="Rate districts by">' + keys.map(function (k) { return '<button type="button" class="chip" data-rk="' + k + '" aria-pressed="' + (state.rank === k) + '"' + (k === "overall" ? "" : ' title="' + esc(C[k].linked) + '"') + ">" + (k === "overall" ? "Overall" : SHORT[k]) + "</button>"; }).join("") + "</div>" +
      '<div class="map" id="map" role="region" aria-label="Map of water districts colored by rating. The same ranking is listed below the map."></div>' +
      '<div class="map-legend" aria-hidden="true"><span><i style="background:var(--good)"></i>OK</span><span><i style="background:var(--watch)"></i>Watch</span><span><i style="background:var(--over)"></i>Over limit</span><span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)"></i>Not in TapTrack yet</span></div>' +
      '<ol class="ranking" id="ranking" aria-live="polite">' + rankingHTML() + "</ol>" +
      '<p class="basis map-note" id="rank-note">' + esc(rankNote()) + "</p></section>";
  }
  function mapStyle(pwsid, rates) {
    var d = byPws(pwsid), me = d && d.id === state.district, x = rates[pwsid];
    if (!d) return { color: mapTok.muted, weight: 1.5, dashArray: "5 5", fillColor: mapTok.muted, fillOpacity: 0.04 };
    var c = x ? mapTok[x.tone] || mapTok.muted : mapTok.muted;
    return { color: me ? mapTok.ink : c, weight: me ? 4 : 2, dashArray: null, fillColor: c, fillOpacity: me ? 0.55 : 0.4 };
  }
  function mapTip(pwsid, rates) {
    var d = byPws(pwsid), o = other(pwsid);
    return d ? esc(d.name + " · " + rateText(rates[pwsid])) : esc((o || { name: pwsid }).name + " · not in TapTrack yet");
  }
  // Recolor the map and redo the ranking for the current year and "rate by" choice.
  function refreshRanking() {
    var y = rankYear(), rates = {}, el;
    D.districts.forEach(function (d) { rates[d.pwsid] = rating(d, state.rank, y); });
    if ((el = document.getElementById("ranking"))) el.innerHTML = rankingHTML();
    if ((el = document.getElementById("rank-note"))) el.textContent = rankNote();
    app.querySelectorAll("[data-rk]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.rk === state.rank)); });
    if (geoLayer) geoLayer.eachLayer(function (l) {
      var p = l.feature.properties.pwsid;
      l.setStyle(mapStyle(p, rates)); l.setTooltipContent(mapTip(p, rates));
    });
  }
  function initMap() {
    if (mapObj) { mapObj.remove(); mapObj = null; }
    var el = document.getElementById("map"); if (!el) return;
    if (!window.L) { el.outerHTML = '<p class="basis">The map could not load. Pick your district from the list at the top.</p>'; return; }
    var cs = getComputedStyle(document.documentElement);
    function tok(n) { return cs.getPropertyValue(n).trim(); }
    mapTok = { good: tok("--good"), watch: tok("--watch"), over: tok("--over"), muted: tok("--muted"), ink: tok("--ink") };
    var y = rankYear(), rates = {};
    D.districts.forEach(function (d) { rates[d.pwsid] = rating(d, state.rank, y); });
    // A district under the address pin that TapTrack doesn't cover yet still gets a heavier outline.
    var pinId = state.pin ? districtAt(state.pin[1], state.pin[0]) : null;
    mapObj = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(mapObj);
    geoLayer = L.geoJSON(B, {
      style: function (f) {
        var p = f.properties.pwsid, s = mapStyle(p, rates);
        if (p === pinId && !byPws(p)) { s.weight = 3.5; s.color = mapTok.ink; s.fillOpacity = 0.15; }
        return s;
      },
      onEachFeature: function (f, lyr) {
        var p = f.properties.pwsid, d = byPws(p), o = other(p);
        lyr.bindTooltip(mapTip(p, rates), { sticky: true });
        lyr.on("click", function () {
          setTimeout(function () { // let Leaflet finish the click before the page redraws
            if (d) choose(d.id);
            else if (o) setMsg(o.name + " is outlined in gray: its full history is coming next.", false);
          }, 0);
        });
      }
    });
    // Leaflet needs a view before it can draw outlines, so fit first, then add. Show all of NY-03 so the colors compare.
    mapObj.fitBounds(geoLayer.getBounds(), { padding: [12, 12] });
    geoLayer.addTo(mapObj);
    if (state.pin) L.circleMarker(state.pin, { radius: 8, color: mapTok.ink, weight: 3, fillColor: tok("--focus"), fillOpacity: 1 }).bindTooltip("Your address").addTo(mapObj);
  }

  app.addEventListener("submit", function (e) { if (e.target.id === "find") { e.preventDefault(); var q = document.getElementById("addr").value.trim(); if (q) findAddress(q); else setMsg("Type an address first, or pick your district.", true); } });
  app.addEventListener("input", function (e) {
    if (e.target.id === "yr") { stopPlay(); setYear(e.target.value); }
    if (e.target.id === "addr") onType(e.target.value.trim());
  });
  app.addEventListener("keydown", function (e) {
    if (e.target.id !== "addr") return;
    var open = !document.getElementById("addr-list").hidden;
    if (e.key === "ArrowDown" && sugg.length) { e.preventDefault(); if (!open) showList(sugg); moveActive(1); }
    else if (e.key === "ArrowUp" && open) { e.preventDefault(); moveActive(-1); }
    else if (e.key === "Enter" && open && active >= 0) { e.preventDefault(); pickSugg(active); }
    else if (e.key === "Escape" && open) { e.preventDefault(); hideList(); }
  });
  app.addEventListener("focusout", function (e) {
    if (e.target.id !== "addr") return;
    setTimeout(function () { var c = app.querySelector(".combo"); if (c && !c.contains(document.activeElement)) hideList(); }, 200);
  });
  app.addEventListener("mousedown", function (e) { if (e.target.closest("[data-opt]")) e.preventDefault(); }); // keep focus in the box while picking
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "pick") choose(t.value);
    if (t.dataset && t.dataset.cmp) { state["cmp" + t.dataset.cmp] = t.value; if (t.dataset.cmp === "A" && state.cmpB === t.value) state.cmpB = null; render(); var s = app.querySelector('[data-cmp="' + t.dataset.cmp + '"]'); if (s) s.focus(); }
    if (t.dataset && t.dataset.concern) { state.concerns[t.dataset.concern] = t.checked; render(); var el = app.querySelector('[data-concern="' + t.dataset.concern + '"]'); if (el) el.focus(); }
  });
  app.addEventListener("click", function (e) {
    var opt = e.target.closest("[data-opt]");
    if (opt) { pickSugg(+opt.dataset.opt); return; }
    var p = e.target.closest("[data-py]");
    if (p && app.contains(p)) { state.pickYear = p.dataset.py; render(); var f = app.querySelector('button[data-py="' + p.dataset.py + '"]'); if (f) f.focus(); return; }
    var b = e.target.closest("button"); if (!b || !app.contains(b)) return;
    if (b.dataset.go) choose(b.dataset.go);
    else if (b.dataset.term) toggleTerm(b);
    else if (b.dataset.rk) { state.rank = b.dataset.rk; refreshRanking(); }
    else if (b.hasAttribute("data-play")) togglePlay(b);
    else if (b.hasAttribute("data-print")) window.print();
    else if (b.hasAttribute("data-share")) copyLink(b);
    else if (b.dataset.key) go("detail", { key: b.dataset.key, pickYear: null });
    else if (b.dataset.view) go(b.dataset.view);
    else if (b.dataset.ck) { state.compareKey = b.dataset.ck; render(); var f = app.querySelector('[data-ck="' + b.dataset.ck + '"]'); if (f) f.focus(); }
  });

  // Start from the link if it names a page, otherwise from the district this browser picked last time.
  state.district = load();
  if (byId(state.district)) state.year = latestYear(byId(state.district));
  if ((location.hash || "").length > 1) applyHash();
  else { render(); syncHash(false); }
  window.TapTrack.expectedYear = expectedYear; // used by tests
  window.TapTrack.dueBanner = function (id, now) { return dueBanner(byId(id), now); };
})();
</script>
